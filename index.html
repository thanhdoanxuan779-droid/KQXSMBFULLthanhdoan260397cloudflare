<link rel="manifest" href="manifest.json">
<title>XS Việt Nam - Cầu</title>

<style>

.cau-board{position:relative}
.cau-column{position:relative;z-index:1}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef1f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button,input,textarea{font-family:inherit}
button{border:0;outline:0}

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ================= CHỌN ĐÀI ================= */

#stationScreen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  height:44px;
  flex:none;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 8px;
}

.user{
  padding:5px 9px;
  border-radius:14px;
  background:#f1f3f6;
  color:#777;
  font-size:9px;
}

.header-icons{
  display:flex;
  gap:4px;
}

.h-icon{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#f2f3f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.station-title{
  height:30px;
  flex:none;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  padding-left:8px;
  color:#159eea;
  font-size:9px;
  font-weight:900;
}

.station-content{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
  padding:4px;
  overflow:hidden;
}

.region-sidebar{
  width:62px;
  flex:none;
  background:#fff;
  border-radius:7px;
  overflow:hidden;
}

.region-btn{
  width:100%;
  height:64px;
  padding:2px;
  background:#fff;
  color:#666;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:6.5px;
  line-height:8px;
  font-weight:800;
}

.region-btn.active{
  color:#159eea;
  background:#e7f6ff;
  border-left:3px solid #159eea;
}

.region-icon{
  width:20px;
  height:20px;
  border:1px solid #aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
}

.stations{
  flex:1;
  min-width:0;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.station-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
}

.station-card{
  position:relative;
  height:70px;
  background:#fff;
  border-radius:8px;
  text-align:left;
  padding:6px;
}

.station-card:active{transform:scale(.98)}

.station-number{
  color:#159eea;
  font-size:7px;
  font-weight:900;
}

.station-name{
  margin-top:3px;
  font-size:10px;
  font-weight:900;
}

.station-day{
  margin-top:3px;
  color:#888;
  font-size:6.5px;
}

.station-circle{
  position:absolute;
  right:5px;
  bottom:5px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#e6f6ff;
  color:#159eea;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5.5px;
  font-weight:900;
}

/* ================= MÀN CẦU ================= */

#cauScreen{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
  padding:4px;
}

.cau-header{
  height:34px;
  flex:none;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:2px 4px;
  margin-bottom:4px;
}

.back{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f1f2f5;
  color:#555;
  font-size:20px;
}

.cau-station{margin-left:5px}

.cau-station strong{
  display:block;
  font-size:10px;
  font-weight:900;
}

.cau-station span{
  display:block;
  color:#888;
  font-size:6.5px;
}

/* ================= KẾT QUẢ ================= */

.result-top{
  width:100%;
  flex:none;
  margin-bottom:4px;
  background:#fff;
  border:1px solid #cfd5dc;
  border-radius:7px;
  overflow:hidden;
}

.result-date-row{
  width:100%;
  height:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #cfd5dc;
}

.result-date{
  color:#777;
  font-size:11px;
  font-weight:800;
}

.result-columns{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.result-box{
  min-width:0;
  background:#fff;
  overflow:hidden;
}

#dbResult{
  border-right:1px solid #cfd5dc;
}

.result-title{
  width:100%;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

#dbResult .result-title{
  color:#d00000;
}

#g1Result .result-title{
  color:#111;
}

.result-current{
  width:100%;
  height:39px;
  min-height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.result-number{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:39px;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
  font-size:19px;
  line-height:39px;
  font-weight:900;
  letter-spacing:1px;
}

#dbNumber{
  color:#d00000;
}

#g1Number{
  color:#111;
}

.history{
  display:none;
  max-height:150px;
  overflow-y:auto;
}

.result-box.open .result-current{
  display:none;
}

.result-box.open .history{
  display:block;
}

.history-row{
  height:22px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.history-number{
  font-size:9px;
  font-weight:900;
  min-width:48px;
  text-align:left;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
}

.history-date{
  width:75px;
  color:#888;
  font-size:7px;
  text-align:right;
  margin-right:7px;

  user-select:none;
  -webkit-user-select:none;
}

#dbHistory .history-number{
  color:#d00000;
}

#g1History .history-number{

/* ================= NHẬP ================= */

.cau-main{
  flex:1;
  min-height:0;
  display:flex;
  gap:4px;
}

.position-column{

.position-btn{

.cau-right{

  min-height:0;

  flex-direction:column;
}

.cau-tabs{

.cau-tab{

  border-radius:6px;
  background:#fff;
  color:#666;
  font-size:7px;
  font-weight:900;
}

.cau-tab.active{
  background:#159eea;
  color:#fff;
}

.cau-content{
  flex:1;
  min-height:0;
  margin-top:3px;
  background:#dff3ff;
  border-radius:7px;
  overflow-x:hidden;
  overflow-y:auto;
  padding:6px;
  direction:rtl;
  touch-action:pan-y;

.cau-title{
  text-align:center;
  color:#159eea;
  font-size:7.5px;
  font-weight:900;
  margin-bottom:6px;
  display:none;

/* ================= DỰ ĐOÁN ================= */

.predict-area{
  width:100%;
  margin-bottom:5px;
}

.predict-buttons{
  display:flex;
  gap:5px;
}

.predict-buttons button{
  width:80px;
  height:28px;
  padding:0;
  border:1px solid #159eea;
  border-radius:5px;
  background:#fff;
  color:#159eea;
  font-size:9px;
  font-weight:700;
}

.predict-buttons button.flash{
  animation:buttonFlash .12s ease;
}

@keyframes buttonFlash{
  0%{
    background:#eaf7ff;
    color:#159eea;
  }
  100%{
    background:#fff;
    color:#159eea;
  }
}

.predict-stats{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:4px;
  min-height:12px;
  font-size:7px;
  font-weight:900;
  color:#555;
}

.predict-mark{
  position:absolute;
  z-index:100;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  pointer-events:none;
  animation:predictionBlink .55s steps(1,end) infinite;
}

@keyframes predictionBlink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}

.predict-mark.t{color:#e53935}
.predict-mark.x{color:#168bd0}

/* ================= CARO ================= */

.cau-board-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:none;
  touch-action:pan-x;
  scroll-behavior:auto;
  scrollbar-width:none;
  direction:ltr;
  padding-bottom:2px;
}
.cau-board-wrap::-webkit-scrollbar{
  display:none;
}
.cau-scrollbar{
  width:100%;
  height:10px;
  margin-top:3px;
  padding:2px 0;
  background:#d5dce3;
  border-radius:8px;

  position:relative;
  touch-action:none;
}
.cau-scrollbar-thumb{
  position:absolute;
  left:0;
  top:2px;
  height:6px;
  min-width:28px;
  background:#8b98a6;
  border-radius:6px;
  transform:translateX(0);
  touch-action:none;
}

.cau-board{
  position:relative;
  width:max-content;
  min-width:100%;
  display:flex;
  align-items:flex-start;
  gap:3px;
  border:1px solid rgba(21,158,234,.65);
  border-radius:4px;
  background-color:#cfeeff;
  background-image:
    linear-gradient(
      rgba(21,158,234,.22) 1px,
      transparent 1px
    ),

      90deg,
      rgba(21,158,234,.22) 1px,
      transparent 1px
    );
  background-size:27px 27px;
  background-position:0 0;
  padding-right:3px;
  direction:ltr;
}

.cau-column{
  width:24px;
  min-width:24px;
  display:flex;
  flex-direction:column;
  gap:3px;
  transform:translateX(1.5px);
}

.cau-cell{
  width:24px;
  height:24px;
  min-width:24px;
  min-height:24px;
  border-radius:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:24px;
  font-weight:900;
  padding:0;
  margin:0;
}

.tai,.le,.prime{
  color:#e53935;
  background:transparent;
}

.xiu,.chan,.composite{
  color:#168bd0;
  background:transparent;
}

@media(max-width:380px){

  .region-sidebar{
    width:59px;
  }

  .position-column{
    width:58px;
  }

  .position-btn{
    font-size:6px;
  }


}

</style>
</head>

/* =====================================================
   DỮ LIỆU ĐÀI
===================================================== */

const STATIONS={

    title:"XS MIỀN BẮC VN",
    station:["XSMB","Xổ số miền Bắc"]
  }
};

/* =====================================================
   BIẾN
===================================================== */


/* =====================================================
   WORKER XSMB - NGUỒN KẾT QUẢ ONLINE
   Worker trả JSON dạng: { ok, count, results:[...] }
===================================================== */
const AUTO_KQ_API =
  "https://thanhdoan260397.thanhdoan260397.workers.dev";


let currentRegion="mb";
let currentDay="";
let currentStation="XSMB";
let currentPosition="dbVan";
let currentType="tx";

let autoSyncTimer=null;
let autoSyncBusy=false;

/* KQ ONLINE CHỈ LƯU TRONG RAM, KHÔNG NHỒI VÀO localStorage. */
let onlineStore={};

/* =====================================================
   SỐ CHỮ SỐ
===================================================== */

function digitLength(type){
  return 5;
}

/* =====================================================
   CHUẨN HÓA TÊN
===================================================== */

function normalize(text){

  return String(text||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")

function isValidISODate(value){
  const match=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match) return false;

  const year=Number(match[1]);
  const month=Number(match[2]);
  const day=Number(match[3]);
  const date=new Date(0);
  date.setUTCHours(0,0,0,0);
  date.setUTCFullYear(year,month-1,day);

  return date.getUTCFullYear()===year &&
    date.getUTCMonth()===month-1 &&
    date.getUTCDate()===day;
}

function formatDateForDisplay(isoDate){
  return isValidISODate(isoDate)
    ?String(isoDate).split("-").reverse().join("/")
    :"";
}

function workerDateToIso(date){

  const s=String(date||"").trim();

  if(!s){
    return "";
  }

  /* ISO: 2026-09-08 */
  let m=s.match(
    /^(\d{4})-(\d{1,2})-(\d{1,2})/
  );

  if(m){

    const isoDate=(
      m[1]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[3]).padStart(2,"0")
    );

    return isValidISODate(isoDate) ? isoDate : "";

  }

  /* DD/MM/YYYY hoặc DD-MM-YYYY */
  m=s.match(
    /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
  );

  if(m){

    const isoDate=(
      m[3]+"-"+
      String(m[2]).padStart(2,"0")+"-"+
      String(m[1]).padStart(2,"0")
    );

    return isValidISODate(isoDate) ? isoDate : "";

  }

  return "";

}


function validNumberFor(
  type,

function getWorkerPrizeType(prize){

  const s=
    String(prize||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/\s+/g," ")
      .trim();

  if(
    s==="db" ||
    s==="d.b" ||
    s.includes("dac biet") ||
    s.includes("giai db") ||
    s.includes("giai dac biet")
  ){

    return "db";

  }

  if(
    s==="1" ||
    s==="g1" ||
    s==="g.1" ||
    s.includes("giai nhat") ||
    s.includes("giai 1")
  ){

    return "g1";

  }

  return "";

}

/* =====================================================
   TỰ ĐỘNG LẤY KQ ONLINE TỪ WORKER
   LƯU THEO NGÀY THỰC TẾ: mới -> cũ
===================================================== */

async function syncOnlineResults(){

  if(autoSyncBusy) return;
  autoSyncBusy=true;

  try{

    console.log("SYNC: bắt đầu lấy KQ từ Worker");

    const url=
      AUTO_KQ_API+
      "/latest?t="+
      Date.now();

    const latestRes=await fetch(url,{
      method:"GET",
      cache:"no-store",
      headers:{"Accept":"application/json"}
    });

    if(!latestRes.ok){
      throw new Error("Worker HTTP "+latestRes.status);
    }

    const latest=await latestRes.json();

    const results=
      Array.isArray(latest?.results)
        ?latest.results
        :[];

    if(!results.length){
      throw new Error("Worker không trả về dữ liệu");
    }

    /*
     * Worker đã xác minh ngày thực tế từ nguồn.
     * HTML chỉ nhận YYYY-MM-DD hợp lệ.
     * Không tự suy ngày, không dùng thứ.
     */
    const onlineAll={};
    const seen=new Set();
    let accepted=0;

    for(const raw of results){

      if(!raw || typeof raw!=="object") continue;

      const rawIso=
        raw.isoDate ??
        raw.date ??
        raw.resultDate ??
        "";

      const isoDate=workerDateToIso(rawIso);

      if(!/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) continue;

      const db=String(raw.db ?? "").replace(/\D/g,"");
      const g1=String(raw.g1 ?? "").replace(/\D/g,"");

      /* Chỉ lấy ĐB + G1, mỗi loại đúng 5 số. */
      if(!/^\d{5}$/.test(db)) continue;
      if(!/^\d{5}$/.test(g1)) continue;

      const key="mb|"+isoDate+"|XSMB";

      /* Tuyệt đối không cho một ngày bị nhập lẫn nhiều bản ghi. */
      if(seen.has(key)) continue;
      seen.add(key);

      const created=
        new Date(isoDate+"T00:00:00+07:00").getTime();

      onlineAll[key]={
        db:[{
          id:"online_db_"+isoDate,
          rowId:"online_"+isoDate,
          number:db,
          locked:true,
          created,
          sourceDate:isoDate,
          sourceDateText:isoDate.split("-").reverse().join("/"),
          online:true,
          region:"mb",
          province:"XSMB"
        }],
        g1:[{
          id:"online_g1_"+isoDate,
          rowId:"online_"+isoDate,
          number:g1,
          locked:true,
          created,
          sourceDate:isoDate,
          sourceDateText:isoDate.split("-").reverse().join("/"),
          online:true,
          region:"mb",
          province:"XSMB"
        }]
      };

      accepted+=2;
    }

    /*
     * Mới -> cũ theo NGÀY THỰC TẾ.
     * Không sắp theo thứ.
     */
    const sortedKeys=Object.keys(onlineAll).sort((a,b)=>{
      const da=a.split("|")[1];
      const db=b.split("|")[1];
      return db.localeCompare(da);
    });

    const sortedStore={};
    for(const key of sortedKeys){
      sortedStore[key]=onlineAll[key];
    }

    onlineStore=sortedStore;

    console.log(
      "SYNC: đã nhận",
      accepted,
      "giải /",
      sortedKeys.length,
      "ngày"
    );

    sortedKeys.forEach(key=>{
      const x=onlineStore[key];
      console.log(
        "KQ ONLINE:",
        key,
        "ĐB:",x.db[0].number,
        "G1:",x.g1[0].number
      );
    });

    if(
      typeof cauScreen!=="undefined" &&
      cauScreen &&
      cauScreen.style.display!=="none"
    ){
      loadLatest();
      drawCau();
    }

  }catch(err){

    console.error("SYNC ERROR:",err);
    console.warn(
      "Không lấy được KQ online:",
      String(err?.message||err)
    );

  }finally{
    autoSyncBusy=false;
  }

}

/* =====================================================
   TÍNH NGÀY ISO
===================================================== */

function getIsoDateForCurrentDay(){

  /* XSMB không phân biệt thứ: luôn lấy ngày thực tế tại Việt Nam. */
  if(currentDay==="ALL"){
    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).format(new Date());
  }

  if(currentDay){

    const now=
      new Date();

    const current=
      getDateDayCode(
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone:"Asia/Ho_Chi_Minh",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
          }
        ).format(now)
      );

    if(current===currentDay){

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone:"Asia/Ho_Chi_Minh",
          year:"numeric",
          month:"2-digit",
          day:"2-digit"
        }
      ).format(now);

    }

    const target=
      {
        T2:1,
        T3:2,
        T4:3,
        T5:4,
        T6:5,
        T7:6,
        CN:0
      }[currentDay];

    const d=
      new Date(now);

    const diff=
      (target-d.getDay()+7)%7;

    d.setDate(
      d.getDate()-diff
    );

    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).format(d);

  }

  const now=
    new Date();

  const parts=
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Ho_Chi_Minh",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(now);

  const obj={};

  parts.forEach(p=>{

    if(p.type!=="literal"){
      obj[p.type]=p.value;
    }

  });

  return (
    obj.year+
    "-"+
    obj.month+
    "-"+
    obj.day
  );

}

/* =====================================================
   ĐẢM BẢO DỮ LIỆU
===================================================== */

function ensureCurrent(){

  /*
   * =====================================================
   * LẤY TOÀN BỘ ONLINE CỦA MIỀN HIỆN TẠI
   *
   * Không dùng:
   * currentDay
   * currentStation
   *
   * Chỉ dùng ngày thực tế.
   * =====================================================
   */

  const onlineDb=[];
  const onlineG1=[];

  Object.keys(onlineStore||{}).forEach(function(k){

    const data=onlineStore[k];

    if(!data){
      return;
    }


    if(Array.isArray(data.db)){

      data.db.forEach(function(item){

        if(!item){
          return;
        }

        const number=
          String(item.number||"")
            .replace(/\D/g,"");

        const date=
          String(item.sourceDate||"")
            .trim();

        if(
          !/^\d{4}-\d{2}-\d{2}$/.test(date)
        ){
          return;
        }

        if(
          !validNumberFor(
            "db",
            number,
            currentRegion
          )
        ){
          return;
        }

        onlineDb.push({
          ...item,
          number:number,
          sourceDate:date,
          online:true
        });

      });

    }


    if(Array.isArray(data.g1)){

      data.g1.forEach(function(item){

        if(!item){
          return;
        }

        const number=
          String(item.number||"")
            .replace(/\D/g,"");

        const date=
          String(item.sourceDate||"")
            .trim();

        if(
          !/^\d{4}-\d{2}-\d{2}$/.test(date)
        ){
          return;
        }

        if(
          !validNumberFor(
            "g1",
            number,
            currentRegion
          )
        ){
          return;
        }

        onlineG1.push({
          ...item,
          number:number,
          sourceDate:date,
          online:true
        });

      });

    }

  });


  /*
   * =====================================================
   * GOM ONLINE THEO NGÀY
   *
   * Mỗi ngày chỉ có 1 DB và 1 G1.
   * Ngày mới -> ngày cũ.
   * =====================================================
   */

  function uniqueByDate(list){

    const map=new Map();

    list.forEach(function(item){

      const date=
        String(item.sourceDate||"").trim();

      if(
        !/^\d{4}-\d{2}-\d{2}$/.test(date)
      ){
        return;
      }

      /*
       * Nếu cùng ngày xuất hiện nhiều lần,
       * lấy bản ghi cuối cùng.
       */
      map.set(date,item);

    });

    return Array.from(map.values())
      .sort(function(a,b){

        return String(b.sourceDate)
          .localeCompare(
            String(a.sourceDate)
          );

      });

  }


  /*
   * =====================================================
   * NẾU WORKER CÓ DỮ LIỆU:
   * DÙNG ONLINE HOÀN TOÀN.
   *
   * KHÔNG TRỘN LOCAL CŨ VÀO.
   * =====================================================
   */

  if(
    onlineDb.length ||
    onlineG1.length
  ){

    const db=uniqueByDate(onlineDb);
    const g1=uniqueByDate(onlineG1);


    /*
     * Chuẩn hóa ngày hiển thị.
     * Chỉ dùng DD/MM/YYYY.
     */

    db.forEach(function(item){

      const date=
        String(item.sourceDate||"");

      item.sourceDateText=
        date.split("-")
          .reverse()
          .join("/");

    });

    g1.forEach(function(item){

      const date=
        String(item.sourceDate||"");

      item.sourceDateText=
        date.split("-")
          .reverse()
          .join("/");

    });


    return {
      db:db,
      g1:g1
    };

  }


  /* Không có dữ liệu online thì không hiển thị dữ liệu local/thủ công. */
  return {
    db:[],
    g1:[]
  };

}

/* =====================================================
   MỚI NHẤT -> CŨ NHẤT
===================================================== */

function newest(list,type){

  const len=digitLength(type);
  const re=new RegExp("^\\d{"+len+"}$");
  const map=new Map();

  (Array.isArray(list)?list:[]).forEach((x,index)=>{
    if(!x) return;

    const number=String(x.number||"").replace(/\D/g,"");
    if(!re.test(number)) return;

    const date=String(x.sourceDate||"").trim();
    const key=(date && /^\d{4}-\d{2}-\d{2}$/.test(date))
      ?"date:"+date
      :"row:"+String(x.rowId||x.id||index);

    const item={...x,number:number};
    const old=map.get(key);
    if(!old || (x.online===true && old.online!==true)){
      map.set(key,item);
    }
  });

  return Array.from(map.values()).sort((a,b)=>{
    const da=String(a.sourceDate||"");
    const db=String(b.sourceDate||"");
    if(da && db && da!==db) return db.localeCompare(da);
    return (Number(b.created)||0)-(Number(a.created)||0);
  });

}

/* =====================================================
   LẤY CHỮ SỐ / TỔNG
===================================================== */

function getDigits(){

  const data=
    ensureCurrent();

  const sumPositions=[

    "dbSum2First",
    "dbSum3First",
    "dbSum4First",
    "dbSum5First",
    "dbSum2Last",
    "dbSum3Last",
    "dbSum4Last",
    "dbSum5Last",
    "dbSum6",

    "dbSum5",

    "g1Sum2First",
    "g1Sum3First",
    "g1Sum4First",
    "g1Sum2Last",
    "g1Sum3Last",
    "g1Sum4Last",
    "g1Sum5"

  ];

  if(
    sumPositions.includes(
      currentPosition
    )
  ){

    const isDB=
      currentPosition.startsWith("db");

    const list=
      isDB
        ?newest(
          data.db,
          "db"
        )
        :newest(
          data.g1,
          "g1"
        );

    const isSixDB=
      isDB &&
      digitLength("db")===6;

    function calcSum(number){

      const s=
        String(number||"");

      const len=
        isDB
          ?digitLength("db")
          :5;

      if(
        !new RegExp(
          "^\\d{"+len+"}$"
        ).test(s)
      ){
        return null;
      }

      let total=0;

      let offset=
        isSixDB
          ?1
          :0;

      if(
        currentPosition==="dbSum2First" ||
        currentPosition==="g1Sum2First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1]);

      }

      else if(
        currentPosition==="dbSum3First" ||
        currentPosition==="g1Sum3First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1])+
          Number(s[offset+2]);

      }

      else if(
        currentPosition==="dbSum4First" ||
        currentPosition==="g1Sum4First"
      ){

        total=
          Number(s[offset])+
          Number(s[offset+1])+
          Number(s[offset+2])+
          Number(s[offset+3]);

      }

      else if(
        currentPosition==="dbSum5First"
      ){

        total=
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum2Last" ||
        currentPosition==="g1Sum2Last"
      ){

        total=
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum3Last" ||
        currentPosition==="g1Sum3Last"
      ){

        total=
          Number(s[len-3])+
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum4Last" ||
        currentPosition==="g1Sum4Last"
      ){

        total=
          Number(s[len-4])+
          Number(s[len-3])+
          Number(s[len-2])+
          Number(s[len-1]);

      }

      else if(
        currentPosition==="dbSum5Last"
      ){

        total=
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum6"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4])+
          Number(s[5]);

      }

      else if(
        currentPosition==="dbSum5"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4]);

      }

      else if(
        currentPosition==="g1Sum5"
      ){

        total=
          Number(s[0])+
          Number(s[1])+
          Number(s[2])+
          Number(s[3])+
          Number(s[4]);

      }

      return String(
        total%10
      );

    }

    return list
      .map(
        x=>
          calcSum(x.number)
      )
      .filter(
        x=>x!==null
      );

  }

  const map={

    dbTramNgan:0,
    dbVan:1,
    dbNgan:2,
    dbTram:3,
    dbTruc:4,
    dbDv:5,

    g1Van:0,
    g1Ngan:1,
    g1Tram:2,
    g1Truc:3,
    g1Dv:4

  };

  /*
   * MB dùng mapping 5 số:
   * Vạn 0 / Ngàn 1 / Trăm 2 / Trục 3 / ĐV 4
   */
  if(
    currentRegion==="mb" &&
    currentPosition.startsWith("db")
  ){

    const mbMap={
      dbVan:0,
      dbNgan:1,
      dbTram:2,
      dbTruc:3,
      dbDv:4
    };

    const mbIndex=
      mbMap[currentPosition];

    if(mbIndex===undefined){
      return [];
    }

    return newest(
      data.db,
      "db"
    )
      .map(
        x=>
          x.number[mbIndex]
      )
      .filter(
        x=>
          x!==undefined
      );

  }

  const index=
    map[currentPosition];

  if(index===undefined){
    return [];
  }

  const isDB=
    currentPosition.startsWith("db");

  const list=
    isDB
      ?newest(
        data.db,
        "db"
      )
      :newest(
        data.g1,
        "g1"
      );

  return list
    .map(
      x=>
        x.number[index]
    )
    .filter(
      x=>
        x!==undefined
    );

}

/* =====================================================
   PHÂN LOẠI
===================================================== */

function classifyDigit(digit){

  const n=
    String(digit);

  if(currentType==="tx"){

    return [
      "5","6","7","8","9"
    ].includes(n)
      ?"T"
      :"X";

  }

  if(currentType==="cl"){

    return [
      "0","2","4","6","8"
    ].includes(n)
      ?"E"
      :"O";

  }

  if(currentType==="ps"){

    return [
      "1","2","3","5","7"
    ].includes(n)
      ?"P"
      :"C";

  }

  return "";

}

/* =====================================================
   DỰNG CẦU
===================================================== */

function buildBridge(values){

  const ROWS=6;
  const board=[];

  if(
    !Array.isArray(values) ||
    !values.length
  ){
    return board;
  }

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    values[0];

  let count=1;

  for(
    let i=1;
    i<values.length;
    i++
  ){

    if(values[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        values[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;

  runs.forEach(run=>{

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  });

  return board;

}

/* =====================================================
   TÌM TỌA ĐỘ TAY TIẾP THEO
===================================================== */

function getPredictionPosition(
  values,
  predictedValue
){

  if(
    !Array.isArray(values) ||
    !values.length ||
    !predictedValue
  ){
    return null;
  }

  const ROWS=6;

  const testValues=
    values.concat(
      predictedValue
    );

  const board=[];

  function occupied(r,c){

    return !!(
      board[r] &&
      board[r][c]!==undefined
    );

  }

  function put(r,c,v){

    if(!board[r]){
      board[r]=[];
    }

    board[r][c]=v;

  }

  const runs=[];

  let value=
    testValues[0];

  let count=1;

  for(
    let i=1;
    i<testValues.length;
    i++
  ){

    if(testValues[i]===value){

      count++;

    }else{

      runs.push({
        value:value,
        count:count
      });

      value=
        testValues[i];

      count=1;

    }

  }

  runs.push({
    value:value,
    count:count
  });

  let startCol=0;
  let lastPosition=null;

  for(const run of runs){

    let r=0;
    let c=startCol;
    let remain=run.count;
    let horizontal=false;

    while(remain>0){

      while(occupied(r,c)){
        c++;
      }

      put(
        r,
        c,
        run.value
      );

      lastPosition={
        row:r,
        col:c
      };

      remain--;

      if(remain<=0){
        break;
      }

      if(horizontal){

        c++;

        while(occupied(r,c)){
          c++;
        }

        continue;

      }

      if(
        r+1<ROWS &&
        !occupied(r+1,c)
      ){

        r++;

      }else{

        horizontal=true;

        c++;

        while(occupied(r,c)){
          c++;
        }

      }

    }

    startCol++;

  }

  return lastPosition;

}

/* =====================================================
   THỐNG KÊ
===================================================== */

function updatePredictionStats(){

  const digits=
    getDigits();

  if(!digits.length){

    predictStats.innerHTML="";

    return;

  }

  const values=
    digits.map(
      classifyDigit
    );

  if(currentType==="tx"){

    const t=
      values.filter(
        x=>x==="T"
      ).length;

    const x=
      values.filter(
        x=>x==="X"
      ).length;

    const total=
      t+x;

    const tp=
      total
        ?Math.round(t/total*100)
        :0;

    const xp=
      total
        ?Math.round(x/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        B: ${t} lần — ${tp}%
      </span>
      <span>
        S: ${x} lần — ${xp}%
      </span>
    `;

    return;

  }

  if(currentType==="cl"){

    const c=
      values.filter(
        x=>x==="E"
      ).length;

    const l=
      values.filter(
        x=>x==="O"
      ).length;

    const total=
      c+l;

    const cp=
      total
        ?Math.round(c/total*100)
        :0;

    const lp=
      total
        ?Math.round(l/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        C: ${c} lần — ${cp}%
      </span>
      <span>
        L: ${l} lần — ${lp}%
      </span>
    `;

    return;

  }

  if(currentType==="ps"){

    const s=
      values.filter(
        x=>x==="P"
      ).length;

    const h=
      values.filter(
        x=>x==="C"
      ).length;

    const total=
      s+h;

    const sp=
      total
        ?Math.round(s/total*100)
        :0;

    const hp=
      total
        ?Math.round(h/total*100)
        :0;

    predictStats.innerHTML=`
      <span>
        SNT: ${s} lần — ${sp}%
      </span>

      <span>
        SH: ${h} lần — ${hp}%
      </span>

    `;

  }

}

function drawCau(){

  if(cauResizeHandler){
    window.removeEventListener("resize",cauResizeHandler);
    cauResizeHandler=null;
  }

  updatePredictionButtons();

  if(currentType==="tx"){

    cauTitle.textContent=
      "CẦU TÀI / XỈU";

  }

  else if(currentType==="cl"){

    cauTitle.textContent=
      "CẦU CHẴN / LẺ";

  }

  else if(currentType==="ps"){

    cauTitle.textContent=
      "CẦU SNT / SH";

  }

  const digits=
    getDigits();

  updatePredictionStats();

  cauArea.innerHTML="";

  if(!digits.length){

    cauArea.innerHTML=`

      <div class="no-data">
        Chưa có dữ liệu
      </div>

    `;

    return;

  }

  const values=
    digits
      .slice()
      .reverse()
      .map(
        classifyDigit
      );

  const bridge=
    buildBridge(values);

  const board=
    document.createElement("div");

  board.className="cau-board";

  let maxCols=0;

  for(
    let r=0;
    r<6;
    r++
  ){

    if(
      bridge[r] &&
      bridge[r].length>maxCols
    ){

      maxCols=
        bridge[r].length;

    }

  }

  for(
    let c=0;
    c<maxCols;
    c++
  ){

    const column=
      document.createElement("div");

    column.className=
      "cau-column";

    let hasCell=false;

    for(
      let r=0;
      r<6;
      r++
    ){

      const value=
        bridge[r] &&
        bridge[r][c];

      if(value){

        column.appendChild(
          makeCell(value)
        );

        hasCell=true;

      }else{

        const empty=
          document.createElement("div");

        empty.style.width="24px";
        empty.style.height="24px";
        empty.style.flex="none";

        column.appendChild(empty);

      }

    }

    if(hasCell){

      board.appendChild(column);

    }

  }

  for(
    let i=0;
    i<4;
    i++
  ){

    const emptyColumn=
      document.createElement("div");

    emptyColumn.className=
      "cau-column";

    for(
      let r=0;
      r<6;
      r++
    ){

      const empty=
        document.createElement("div");

      empty.style.width="24px";
      empty.style.height="24px";
      empty.style.flex="none";

      emptyColumn.appendChild(empty);

    }

    board.appendChild(
      emptyColumn
    );

  }

  if(
    prediction==="T" ||
    prediction==="X" ||
    prediction==="E" ||
    prediction==="O" ||
    prediction==="P" ||
    prediction==="C"
  ){

    const nextPos=
      getPredictionPosition(
        values,
        prediction
      );

    if(nextPos){

      const mark=
        document.createElement("div");

      mark.className=
        "predict-mark";

      if(
        prediction==="T" ||
        prediction==="O" ||
        prediction==="P"
      ){

        mark.classList.add("t");

      }else{

        mark.classList.add("x");

      }

      mark.textContent=
        prediction==="T"
          ?"B"
          :prediction==="X"
            ?"S"
            :prediction;

      mark.style.left=
        (
          nextPos.col*27+
          1.5+
          1
        )+
        "px";

      mark.style.top=
        (
          nextPos.row*27+
          1
        )+
        "px";

      board.appendChild(mark);

    }

  }

  const boardWrap=document.createElement("div");
  boardWrap.className="cau-board-wrap";
  boardWrap.appendChild(board);

  /* Thanh con lăn riêng, luôn nhìn thấy trên iPhone/iPad. */
  const scrollBar=document.createElement("div");
  scrollBar.className="cau-scrollbar";

  const scrollThumb=document.createElement("div");
  scrollThumb.className="cau-scrollbar-thumb";
  scrollBar.appendChild(scrollThumb);

  cauArea.appendChild(boardWrap);
  cauArea.appendChild(scrollBar);

  function updateCauScrollbar(){
    const view=boardWrap.clientWidth;
    const total=boardWrap.scrollWidth;
    const track=scrollBar.clientWidth;

    if(!view || !total || !track) return;

    const maxScroll=Math.max(0,total-view);

    if(maxScroll<=0){
      scrollBar.style.display="none";
      return;
    }

    scrollBar.style.display="block";

    const thumbW=Math.max(
      28,
      track*(view/total)
    );

    const maxThumb=track-thumbW;
    const left=maxScroll>0
      ? (boardWrap.scrollLeft/maxScroll)*maxThumb
      : 0;

    scrollThumb.style.width=thumbW+"px";
    scrollThumb.style.transform="translateX("+left+"px)";
  }

  boardWrap.addEventListener("scroll",updateCauScrollbar,{passive:true});
  cauResizeHandler=updateCauScrollbar;
  window.addEventListener("resize",cauResizeHandler);

  /* Kéo trực tiếp vào con lăn. */
  let barDragStartX=0;
  let barStartScroll=0;

  scrollThumb.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(inertiaFrame){
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame=0;
    }
    barDragStartX=e.touches[0].clientX;
    barStartScroll=boardWrap.scrollLeft;
  },{passive:false});

  scrollThumb.addEventListener("touchmove",function(e){
    e.preventDefault();

    const total=boardWrap.scrollWidth;
    const view=boardWrap.clientWidth;
    const track=scrollBar.clientWidth;
    const thumbW=scrollThumb.offsetWidth;
    const maxScroll=Math.max(0,total-view);
    const maxThumb=Math.max(1,track-thumbW);

    boardWrap.scrollLeft=
      barStartScroll+
      (e.touches[0].clientX-barDragStartX)*
      (maxScroll/maxThumb);

    updateCauScrollbar();
  },{passive:false});

  /* Bấm vào rãnh: nhảy tới vị trí tương ứng. */
  scrollBar.addEventListener("touchstart",function(e){
    if(e.target===scrollThumb) return;

    const rect=scrollBar.getBoundingClientRect();
    const track=scrollBar.clientWidth;
    const total=boardWrap.scrollWidth;
    const view=boardWrap.clientWidth;
    const maxScroll=Math.max(0,total-view);
    const thumbW=scrollThumb.offsetWidth;
    const maxThumb=Math.max(1,track-thumbW);

    const x=e.touches[0].clientX-rect.left;
    const target=Math.max(0,Math.min(maxThumb,x-thumbW/2));

    boardWrap.scrollLeft=(target/maxThumb)*maxScroll;
    updateCauScrollbar();
  },{passive:true});

  /* Mở Cầu là đứng ngay cột cuối bên phải, không cần kéo. */
  requestAnimationFrame(()=>{
    boardWrap.scrollLeft=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );
    updateCauScrollbar();
  });

  /*
   * Vuốt 1:1 theo ngón tay.
   * Hất càng mạnh -> quán tính càng nhanh, nhưng chỉ chạy SAU khi nhả tay.
   */
  let lastTouchX=null;
  let lastTouchTime=0;
  let velocity=0;
  let inertiaFrame=0;

  boardWrap.addEventListener("touchstart",function(e){
    if(inertiaFrame){
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame=0;
    }

    if(e.touches && e.touches.length){
      lastTouchX=e.touches[0].clientX;
      lastTouchTime=performance.now();
      velocity=0;
    }
  },{passive:true});

  boardWrap.addEventListener("touchmove",function(e){
    if(lastTouchX===null || !e.touches || !e.touches.length) return;
    e.preventDefault();

    const now=performance.now();
    const x=e.touches[0].clientX;
    const dt=Math.max(8,now-lastTouchTime);
    const dx=x-lastTouchX;

    lastTouchX=x;
    lastTouchTime=now;

    const maxScroll=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );

    /* 1px ngón tay = 1px bảng, tuyệt đối không nhân tốc độ. */
    let next=boardWrap.scrollLeft-dx;

    if(next<0) next=0;
    if(next>maxScroll) next=maxScroll;

    boardWrap.scrollLeft=next;

    /* Lấy vận tốc vuốt thực tế, làm mượt để cú hất mạnh không bị mất ở frame cuối. */
    const instantVelocity=(-dx/dt)*1000;
    velocity=(velocity*0.55)+(instantVelocity*0.45);

    if(velocity>3500) velocity=3500;
    if(velocity<-3500) velocity=-3500;
  },{passive:false});

  function runInertia(){
    const maxScroll=Math.max(
      0,
      boardWrap.scrollWidth-boardWrap.clientWidth
    );

    /* Vuốt nhẹ: dừng hẳn khi nhả tay. */
    if(Math.abs(velocity)<650){
      velocity=0;
      inertiaFrame=0;
      return;
    }

    let next=boardWrap.scrollLeft+(velocity/60);

    if(next<=0){
      boardWrap.scrollLeft=0;
      velocity=0;
      inertiaFrame=0;
      return;
    }

    if(next>=maxScroll){
      boardWrap.scrollLeft=maxScroll;
      velocity=0;
      inertiaFrame=0;
      return;
    }

    boardWrap.scrollLeft=next;
    velocity*=0.93;

    inertiaFrame=requestAnimationFrame(runInertia);
  }

  boardWrap.addEventListener("touchend",function(){
    lastTouchX=null;
    lastTouchTime=0;
    runInertia();
  },{passive:true});

  boardWrap.addEventListener("touchcancel",function(){
    lastTouchX=null;
    lastTouchTime=0;
    runInertia();
  },{passive:true});

  updateCauScrollbar();

}

   Ô CẦU
===================================================== */

function makeCell(value){

  const cell=
    document.createElement("div");

  cell.className=
    "cau-cell";

  if(value==="T"){
    cell.textContent="B";
  }
  else if(value==="X"){
    cell.textContent="S";
  }
  else{
    cell.textContent=value;
  }

  if(value==="T"){
    cell.classList.add("tai");
  }

  if(value==="X"){
    cell.classList.add("xiu");
  }

  if(value==="E"){
    cell.classList.add("chan");
  }

  if(value==="O"){
    cell.classList.add("le");
  }

  if(value==="P"){
    cell.classList.add("prime");
  }

  if(value==="C"){
    cell.classList.add("composite");
  }

  return cell;

}

renderStations();

/* Lấy toàn bộ KQ Worker 1 lần khi mở app */
startAutoSync();

/* =====================================================
   KHỞI TẠO MÀN CHỌN ĐÀI
   Đảm bảo mở app là hiện ngay danh sách đài MB.
===================================================== */
function initStationScreen(){
  currentRegion="mb";
  currentPosition="dbVan";

  document
    .querySelectorAll(".region-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.region==="mb"
      );
    });

  renderStations();
}

if(document.readyState==="loading"){
  document.addEventListener(
    "DOMContentLoaded",
    initStationScreen,
    {once:true}
  );
}else{
  requestAnimationFrame(initStationScreen);
}
